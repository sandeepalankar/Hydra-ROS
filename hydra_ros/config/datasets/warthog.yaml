---
input:
  type: RosInput
  tf_verbosity: 1
  clear_queue_on_fail: true
  inputs:
    left_cam:
      receiver: 
        type: ClosedSetImageReceiver
        qos:
          reliability: best_effort
          durability: volatile
          history: keep_last
      sensor:
        type: camera_info
        min_range: 0.1
        max_range: 5.0
        extrinsics:
          type: ros
          sensor_frame: willow/multisense_front_left_camera_optical_frame
          robot_frame: willow/base_link

